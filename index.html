<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bryan Goh</title>
    <meta name="description" content="Something new is coming.">
    <link rel="canonical" href="https://gohjhb92.github.io/">
    <meta name="theme-color" content="#f7f7f4">
    <link rel="icon" href="favicon.svg" type="image/svg+xml">
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

      body {
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif;
        background: #f7f7f4;
        color: #1a1a1a;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 2rem;
      }

      .container {
        max-width: 480px;
        width: 100%;
        text-align: center;
      }

      .mark {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        width: 48px;
        height: 48px;
        background: #1a1a1a;
        color: #f7f7f4;
        font-size: 1rem;
        font-weight: 700;
        letter-spacing: -0.02em;
        border-radius: 6px;
        margin-bottom: 2rem;
      }

      h1 {
        font-size: 1.5rem;
        font-weight: 700;
        letter-spacing: -0.03em;
        margin-bottom: 0.75rem;
      }

      p {
        font-size: 1rem;
        color: #555;
        line-height: 1.6;
        margin-bottom: 2rem;
      }

      .link {
        display: inline-block;
        padding: 0.6rem 1.25rem;
        background: #1a1a1a;
        color: #f7f7f4;
        text-decoration: none;
        font-size: 0.875rem;
        font-weight: 600;
        border-radius: 6px;
        transition: opacity 0.15s;
      }

      .link:hover { opacity: 0.75; }

      footer {
        margin-top: 3rem;
        font-size: 0.75rem;
        color: #aaa;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <div class="mark">BG</div>
      <h1>Something new is coming.</h1>
      <p>This page is under construction. In the meantime, visit the portfolio.</p>
      <a class="link" href="/main_page/">View Portfolio</a>
    </div>
    <footer>&copy; 2026 Bryan Goh</footer>
  </body>
</html>
